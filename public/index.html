<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GoooG - Celebrity Guessing Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#06060c">
    <meta name="description" content="Ultra-premium celebrity guessing game with Spaced Repetition (SRS), multiple modes, and community gallery.">
</head>
<body>
    <!-- Toast Notifications Container -->
    <div id="toast-container" aria-live="polite"></div>

    <!-- Universal Zoom Lightbox -->
    <div id="zoom-lightbox" class="hidden">
        <button id="close-lightbox" aria-label="Close image">×</button>
        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="Zoomed image">
            <div id="lightbox-label" class="hidden"></div>
        </div>
    </div>

    <!-- Main Application Shell -->
    <div id="app-container">
        <!-- Auth View -->
        <section id="view-auth" class="view hidden">
            <div class="auth-box">
                <h1 class="logo glow-text">GoooG</h1>
                <div class="auth-tabs">
                    <button id="tab-login" class="active">Login</button>
                    <button id="tab-register">Register</button>
                </div>
                
                <form id="form-login">
                    <input type="text" id="login-username" placeholder="Username" required autocomplete="username">
                    <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password">
                    <label class="remember-me">
                        <input type="checkbox" id="login-remember"> Remember me (30 days)
                    </label>
                    <button type="submit" class="btn-primary">Login</button>
                </form>
                
                <form id="form-register" class="hidden">
                    <input type="text" id="register-username" placeholder="Username (3-20 chars)" required minlength="3" maxlength="20" autocomplete="username">
                    <input type="password" id="register-password" placeholder="Password (min 8 chars)" required minlength="8" autocomplete="new-password">
                    <button type="submit" class="btn-primary">Register</button>
                </form>
            </div>
        </section>

        <!-- Main Layout (Navbar + Content + Bottom Bar) -->
        <section id="view-main" class="view hidden">
            <header class="top-nav">
                <div class="nav-brand glow-text" data-nav="home">GoooG</div>
                
                <div class="nav-links desktop-only">
                    <button data-nav="home" class="nav-item active">🏠 Home</button>
                    <button data-nav="gallery" class="nav-item">🖼️ Gallery</button>
                    <button data-nav="stats" class="nav-item">📊 Stats</button>
                    <button data-nav="leaderboard" class="nav-item">🏆 Leaderboard</button>
                    <button data-nav="admin" class="nav-item">🕷️ Smart Import</button>
                </div>

                <div class="nav-user">
                    <span id="streak-badge" class="cursor-pointer" title="Daily Streak">🔥 <span id="streak-count">1</span></span>
                    <button id="btn-profile" class="btn-icon" aria-label="Settings">⚙️</button>
                    <button id="btn-logout" class="btn-icon" aria-label="Logout">🚪</button>
                </div>
            </header>

            <main id="main-content">
                <!-- Pages injected here by router -->
                <div id="page-home" class="page"></div>
                <div id="page-gallery" class="page hidden"></div>
                <div id="page-stats" class="page hidden"></div>
                <div id="page-leaderboard" class="page hidden"></div>
                <div id="page-admin" class="page hidden"></div>
            </main>

            <!-- Mobile Bottom Nav -->
            <nav class="bottom-nav mobile-only">
                <button data-nav="home" class="nav-item active"><span>🏠</span><span>Home</span></button>
                <button data-nav="gallery" class="nav-item"><span>🖼️</span><span>Gallery</span></button>
                <button data-nav="stats" class="nav-item"><span>📊</span><span>Stats</span></button>
                <button data-nav="leaderboard" class="nav-item"><span>🏆</span><span>Rank</span></button>
                <button data-nav="admin" class="nav-item"><span>🕷️</span><span>Import</span></button>
            </nav>
        </section>

        <!-- Game View (Full screen, no nav) -->
        <section id="view-game" class="view hidden">
            <!-- Game UI dynamically rendered by game.js -->
        </section>
    </div>

    <!-- Daily Streak Celebration Modal -->
    <div id="modal-streak" class="modal hidden">
        <div class="modal-content text-center">
            <h2 class="glow-text text-2xl mb-2">🎉 Daily Login Streak!</h2>
            <div style="font-size: 4rem; margin: 1rem 0;" class="pulsing-red-dot-none">🔥</div>
            <p class="text-xl font-bold mb-2"><span id="modal-streak-days" class="glow-text text-2xl">1</span> Days in a row!</p>
            <p class="color-text-muted text-xs mb-4">Come back tomorrow to keep your streak alive and unlock bonus lifelines.</p>
            <button id="btn-close-streak" class="btn-primary w-full mt-2">Let's Play 🚀</button>
        </div>
    </div>
    
    <!-- Round Setup Modal -->
    <div id="modal-round-setup" class="modal hidden bottom-sheet">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="setup-category-title" class="glow-text text-xl">Category</h2>
                <button class="close-modal" id="btn-close-setup-modal">×</button>
            </div>
            <div class="modal-body">
                <div class="font-bold text-sm color-text-muted mb-2">Select Game Mode</div>
                <div class="pill-group" id="setup-mode">
                    <button class="pill active" data-val="classic">🎯 Classic (4 Options)</button>
                    <button class="pill" data-val="hot_or_not">🔥 Hot or Not (2 Images)</button>
                    <button class="pill" data-val="sudden_death">💀 Sudden Death (1-Life)</button>
                    <button class="pill" data-val="review">🧠 SRS Review (Due First)</button>
                </div>
                
                <div class="font-bold text-sm color-text-muted mb-2">Select Questions Count</div>
                <div class="pill-group" id="setup-rounds">
                    <button class="pill active" data-val="15">15</button>
                    <button class="pill" data-val="35">35</button>
                    <button class="pill" data-val="50">50</button>
                    <button class="pill" data-val="100">100</button>
                    <button class="pill" data-val="unlimited">∞ Unlimited</button>
                </div>
                
                <button id="btn-start-game" class="btn-primary w-full mt-4 btn-huge">
                    START ROUND 🚀
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="/app.js"></script>
</body>
</html>
